name: Vite Dev Server

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Start Vite
        run: |
          npm run dev -- --host 0.0.0.0 --port 5173 > vite.log 2>&1 &
          sleep 5

      - name: Show Vite output
        run: cat vite.log

      - name: Install Cloudflare Tunnel
        run: |
          curl -L \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o cloudflared
          chmod +x cloudflared

      - name: Expose Vite
        run: |
          ./cloudflared tunnel --url http://127.0.0.1:5173
